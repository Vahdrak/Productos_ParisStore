server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1000;

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    # index.html nunca se cachea: así cada despliegue nuevo se ve de inmediato.
    # (Los .js/.css de Angular llevan el hash en el nombre, por eso el resto sí puede cachearse mucho tiempo.)
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier otra ruta devuelve la app (no usa router, pero así un F5 nunca da 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La API NO pasa por aquí: el front llama directo al puerto 5000 del mismo host (ver docker-compose.yml).
    # Para ponerlo detrás de HTTPS/un solo puerto, habría que proxyar /api/ al backend y cambiar la URL base del front.
}
