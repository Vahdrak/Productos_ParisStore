<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Compras Paraguai - Prueba de Productos</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      :root {
        --surface-0: #f1efe8;
        --surface-1: #d3d1c7;
        --surface-2: #ffffff;
        --text-primary: #2c2c2a;
        --text-secondary: #888780;
        --text-muted: #b4b2a9;
        --border: rgba(0, 0, 0, 0.1);
        --border-strong: rgba(0, 0, 0, 0.2);
        --border-stronger: rgba(0, 0, 0, 0.4);
        --fill-accent: #378add;
        --fill-accent-hover: #185fa5;
        --fill-danger: #e24b4a;
        --fill-danger-hover: #a32d2d;
        --fill-success: #639922;
        --bg-accent: #e6f1fb;
        --bg-danger: #fcebeb;
        --bg-warning: #faeeda;
        --bg-success: #eaf3de;
        --text-accent: #185fa5;
        --text-danger: #a32d2d;
        --text-warning: #854f0b;
        --text-success: #3b6d11;
        --on-accent: #ffffff;
        --on-danger: #ffffff;
        --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --radius: 8px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface-0: #2c2c2a;
          --surface-1: #444441;
          --surface-2: #5f5e5a;
          --text-primary: #f1efe8;
          --text-secondary: #b4b2a9;
          --text-muted: #888780;
          --border: rgba(255, 255, 255, 0.1);
          --border-strong: rgba(255, 255, 255, 0.2);
          --border-stronger: rgba(255, 255, 255, 0.4);
        }
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        font-family: var(--font-sans);
        background-color: var(--surface-0);
        color: var(--text-primary);
      }

      app-root {
        display: block;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
