version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: catalogos_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-catalogosdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - comprasparaguai-network

  # Backend API
  backend:
    image: proyectsoft/comprasparaguai-api:latest
    container_name: backend_api_prod
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-catalogosdb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://172.16.249.94:4200,http://172.16.249.94}
      - Auth__JwtSecret=${AUTH_JWT_SECRET:-}
      - Auth__AdminUsuario=${AUTH_ADMIN_USUARIO:-}
      - Auth__AdminPassword=${AUTH_ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network

  # Frontend (Angular)
  frontend:
    image: proyectsoft/comprasparaguai-frontend:latest
    container_name: frontend_prod
    ports:
      - "4200:80"
    depends_on:
      - backend
    restart: always
    networks:
      - comprasparaguai-network

  # Worker.Sync (Oracle → PostgreSQL)
  worker-sync:
    image: proyectsoft/comprasparaguai-worker-sync:latest
    container_name: worker_sync_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-catalogosdb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - OracleConnection__ConnectionString=${ORACLE_CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 2G

  # Worker.Compras (Send to Compras Paraguai API)
  worker-compras:
    image: proyectsoft/comprasparaguai-worker-compras:latest
    container_name: worker_compras_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-catalogosdb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - Compras__ApiUrl=${COMPRAS_API_URL:-https://produtos.comprasparaguai.com.br}
      - Compras__Token=${COMPRAS_API_TOKEN}
      - Compras__IntervalHours=2
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Worker.Compara (Send to Compara Paraguai API)
  worker-compara:
    image: proyectsoft/comprasparaguai-worker-compara:latest
    container_name: worker_compara_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-catalogosdb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres}
      - Compara__ApiUrl=${COMPARA_API_URL:-https://comparaparaguai.com/api/integracao/produtos}
      - Compara__Token=${COMPARA_API_TOKEN}
      - Compara__IntervalHours=2
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data:
    driver: local

networks:
  comprasparaguai-network:
    driver: bridge
