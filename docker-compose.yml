version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: comprasparaguai_db_prod
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-comprasparaguaidb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  api:
    image: escarlos/comprasparaguai-api:latest
    container_name: comprasparaguai_api_prod
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-comprasparaguaidb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-password}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network

  # Frontend (Angular)
  frontend:
    image: escarlos/comprasparaguai-frontend:latest
    container_name: comprasparaguai_frontend_prod
    ports:
      - "4200:80"
    depends_on:
      - api
    restart: always
    networks:
      - comprasparaguai-network

  # Worker.Sync (Oracle → PostgreSQL)
  worker-sync:
    image: escarlos/comprasparaguai-worker-sync:latest
    container_name: comprasparaguai_worker_sync_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-comprasparaguaidb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-password}
      - OracleConnection__ConnectionString=${ORACLE_CONNECTION_STRING}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 2G

  # Worker.Compras (Send to Compras Paraguai API)
  worker-compras:
    image: escarlos/comprasparaguai-worker-compras:latest
    container_name: comprasparaguai_worker_compras_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-comprasparaguaidb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-password}
      - Compras__ApiUrl=${COMPRAS_API_URL:-https://produtos.comprasparaguai.com.br}
      - Compras__Token=${COMPRAS_API_TOKEN}
      - Compras__IntervalHours=2
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Worker.Compara (Send to Compara Paraguai API)
  worker-compara:
    image: escarlos/comprasparaguai-worker-compara:latest
    container_name: comprasparaguai_worker_compara_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-comprasparaguaidb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-password}
      - Compara__ApiUrl=${COMPARA_API_URL:-https://comparaparaguai.com/api/integracao/produtos}
      - Compara__Token=${COMPARA_API_TOKEN}
      - Compara__IntervalHours=2
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 1G

  # Worker.Verify (Verify sent products)
  worker-verify:
    image: escarlos/comprasparaguai-worker-verify:latest
    container_name: comprasparaguai_worker_verify_prod
    environment:
      - ConnectionStrings__PostgreSQL=Host=db;Port=5432;Database=${DB_NAME:-comprasparaguaidb};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-password}
      - Compras__ApiUrl=${COMPRAS_API_URL:-https://produtos.comprasparaguai.com.br}
      - Compras__Token=${COMPRAS_API_TOKEN}
      - Verify__SampleSize=500
      - Verify__DelayMs=100
      - Verify__OutputDir=/app/verify-output
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
    networks:
      - comprasparaguai-network
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - verify_output:/app/verify-output

volumes:
  postgres_data:
    driver: local
  verify_output:
    driver: local

networks:
  comprasparaguai-network:
    driver: bridge
